<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LIBERO Camera Tuner</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div id="app" class="app-shell" aria-busy="true">
      <header class="app-header">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">L</span>
          <div>
            <h1>LIBERO Camera Tuner</h1>
            <p id="task-context">Loading task inventory</p>
          </div>
        </div>
        <div class="progress-block">
          <div class="progress-copy">
            <span>Calibration progress</span>
            <strong id="progress-count">0 / 40</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="progress-bar"></span>
          </div>
        </div>
      </header>

      <aside class="task-sidebar" aria-label="Task list">
        <div class="panel-heading">
          <h2>Tasks</h2>
          <span id="suite-count">4 suites</span>
        </div>
        <nav id="task-list" class="task-list"></nav>
      </aside>

      <main class="workspace">
        <div id="camera-tabs" class="camera-tabs" role="tablist"></div>
        <section id="preview-stage" class="preview-stage" aria-label="Camera preview">
          <div class="image-frame">
            <img id="main-preview" alt="Current operation camera preview" draggable="false">
            <div id="preview-loading" class="preview-loading">Rendering</div>
          </div>
          <div class="active-camera-label">
            <span id="active-camera-dot"></span>
            <strong id="active-camera-name">Back</strong>
          </div>
        </section>
        <section id="thumbnail-strip" class="thumbnail-strip" aria-label="Camera thumbnails"></section>
      </main>

      <aside class="inspector">
        <section class="inspector-section">
          <div class="panel-heading">
            <h2>Scene</h2>
            <span id="demo-meta">Demo 1</span>
          </div>
          <label class="field-label" for="demo-select">Demonstration</label>
          <select id="demo-select"></select>
          <div class="field-row">
            <label class="field-label" for="frame-slider">Frame</label>
            <output id="frame-output" for="frame-slider">1 / 1</output>
          </div>
          <input id="frame-slider" type="range" min="0" max="0" value="0">
          <input id="frame-number" class="frame-number" type="number" min="0" value="0" aria-label="Frame index">
        </section>

        <section class="inspector-section">
          <div class="panel-heading">
            <h2>World pose</h2>
            <div class="pose-heading-actions">
              <button id="copy-pose" class="pose-command-button" type="button" title="Copy active camera pose" disabled>Copy</button>
              <button id="paste-pose" class="pose-command-button" type="button" title="Copy a pose first" disabled>Paste</button>
              <button id="reset-camera" class="icon-button" type="button" title="Reset active camera" aria-label="Reset active camera">&#8634;</button>
            </div>
          </div>
          <form id="pose-form" class="pose-form" aria-label="Camera world pose">
            <div class="pose-field-group">
              <span class="pose-group-label">Position</span>
              <div class="pose-input-row position-inputs">
                <label><span>X</span><input type="number" step="any" required data-pose-group="position" data-pose-index="0" aria-label="World position X"></label>
                <label><span>Y</span><input type="number" step="any" required data-pose-group="position" data-pose-index="1" aria-label="World position Y"></label>
                <label><span>Z</span><input type="number" step="any" required data-pose-group="position" data-pose-index="2" aria-label="World position Z"></label>
              </div>
            </div>
            <div class="pose-field-group">
              <span class="pose-group-label">Quaternion wxyz</span>
              <div class="pose-input-row quaternion-inputs">
                <label><span>W</span><input type="number" step="any" required data-pose-group="quaternion_wxyz" data-pose-index="0" aria-label="Quaternion W"></label>
                <label><span>X</span><input type="number" step="any" required data-pose-group="quaternion_wxyz" data-pose-index="1" aria-label="Quaternion X"></label>
                <label><span>Y</span><input type="number" step="any" required data-pose-group="quaternion_wxyz" data-pose-index="2" aria-label="Quaternion Y"></label>
                <label><span>Z</span><input type="number" step="any" required data-pose-group="quaternion_wxyz" data-pose-index="3" aria-label="Quaternion Z"></label>
              </div>
            </div>
            <button id="apply-pose" class="apply-pose-button" type="submit">Apply pose</button>
          </form>
        </section>

        <section class="inspector-section movement-section">
          <div class="panel-heading">
            <h2>3D translation</h2>
            <div id="speed-control" class="segmented" aria-label="Movement speed">
              <button type="button" data-speed="0.002">Fine</button>
              <button type="button" data-speed="0.01" class="active">Med</button>
              <button type="button" data-speed="0.05">Fast</button>
            </div>
          </div>
          <div id="translation-controls" class="translation-controls" aria-label="Camera-local 3D translation">
            <div class="axis-control">
              <span class="axis-label axis-x" aria-hidden="true">X</span>
              <button type="button" data-move="left" title="Move left (-X)" aria-label="Move left along negative X">&#8592;</button>
              <button type="button" data-move="right" title="Move right (+X)" aria-label="Move right along positive X">&#8594;</button>
            </div>
            <div class="axis-control">
              <span class="axis-label axis-y" aria-hidden="true">Y</span>
              <button type="button" data-move="down" title="Move down (-Y)" aria-label="Move down along negative Y">&#8595;</button>
              <button type="button" data-move="up" title="Move up (+Y)" aria-label="Move up along positive Y">&#8593;</button>
            </div>
            <div class="axis-control">
              <span class="axis-label axis-z" aria-hidden="true">Z</span>
              <button type="button" data-move="forward" title="Move forward (-Z)" aria-label="Move forward along negative Z">&#9650;</button>
              <button type="button" data-move="backward" title="Move backward (+Z)" aria-label="Move backward along positive Z">&#9660;</button>
            </div>
          </div>
        </section>

        <section class="confirm-section">
          <div id="save-state" class="save-state">
            <span></span>
            <strong>Unchanged</strong>
          </div>
          <div class="checkpoint-actions">
            <button id="save-progress" class="checkpoint-button" type="button">Save task</button>
            <button id="download-config" class="checkpoint-button" type="button">Download YAML</button>
          </div>
          <button id="confirm-task" class="confirm-button" type="button">
            <span>Confirm and next task</span>
            <span aria-hidden="true">&#8594;</span>
          </button>
        </section>
      </aside>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
